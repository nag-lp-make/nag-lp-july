<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lesson Schedule | NAG STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #faf8f5;
    color: #424242;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  .top-line { height: 3px; background: #c9a96e; }
  .wrap {
    max-width: 390px;
    min-height: 100vh;
    min-height: 100svh;
    margin: 0 auto;
    padding: 48px 24px 40px;
    display: flex;
    flex-direction: column;
  }
  header { text-align: center; margin: 40px 0 48px; }
  .eyebrow {
    font-size: 28px;
    letter-spacing: 0.3em;
    font-weight: 300;
    color: #c9a96e;
    margin-bottom: 14px;
    margin-right: -0.3em; /* letter-spacing分の中心ズレを補正 */
  }
  h1 { font-size: 18px; font-weight: 400; letter-spacing: 0.08em; }
  main { flex: 1; display: flex; flex-direction: column; }

  .group { --accent: #c9a96e; }
  .group.pilates { --accent: #8fb8a8; }

  .group-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.25em;
    color: #999;
    border-top: 1px solid #e8e0d5;
    padding: 32px 0 12px;
  }
  .group:first-child .group-label { border-top: none; padding-top: 0; }
  .group + .group { margin-top: 40px; }
  .list { display: flex; flex-direction: column; gap: 12px; }

  .btn {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 24px;
    background: #ffffff;
    border: 1px solid #e8e0d5;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    color: #424242;
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:active { transform: scale(0.98); box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
  .icon { flex-shrink: 0; width: 22px; height: 22px; color: var(--accent); }
  .text { flex: 1; min-width: 0; }
  .main-t { display: block; font-size: 15px; font-weight: 500; letter-spacing: 0.08em; }
  .sub-t { display: block; font-size: 11px; font-weight: 300; letter-spacing: 0.08em; margin-top: 4px; color: #6d6d6d; }
  .arrow { flex-shrink: 0; font-size: 24px; line-height: 1; font-weight: 300; color: #c9a96e; }
  footer {
    border-top: 1px solid #e8e0d5;
    padding-top: 24px;
    margin-top: 48px;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: #9e9e9e;
  }
</style>
</head>
<body>
<div class="top-line"></div>

          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
          <span class="text"><span class="main-t">則武新町店</span><span class="sub-t">イオン則武新町</span></span>

          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
          <span class="text"><span class="main-t">ナゴヤドーム前店</span><span class="sub-t">イオンモールナゴヤドーム前</span></span>

          <span class="text"><span class="main-t">則武新町店</span><span class="sub-t">イオン則武新町</span></span>

        <a class="btn" href="https://pilates-nag.com/%E3%82%B9%E3%82%BF%E3%82%B8%E3%82%AA/%E6%98%9F%E3%81%8C%E4%B8%98%E3%83%86%E3%83%A9%E3%82%B9%E5%BA%97/#:~:text=%E3%81%9F%E3%81%97%E3%81%BE%E3%81%99%E3%80%82-,%E3%83%AC%E3%83%83%E3%82%B9%E3%83%B3%E3%82%B9%E3%82%B1%E3%82%B8%E3%83%A5%E3%83%BC%E3%83%AB,-11%E6%9C%88" target="_blank" rel="noopener">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>

        </a>
        <a class="btn" href="https://pilates-nag.com/%E3%82%B9%E3%82%BF%E3%82%B8%E3%82%AA/%E3%83%8A%E3%82%B4%E3%83%A4%E3%83%89%E3%83%BC%E3%83%A0%E5%BA%97/#:~:text=%E3%81%9F%E3%81%97%E3%81%BE%E3%81%99%E3%80%82-,%E3%83%AC%E3%83%83%E3%82%B9%E3%83%B3%E3%82%B9%E3%82%B1%E3%82%B8%E3%83%A5%E3%83%BC%E3%83%AB,-11%E6%9C%88" target="_blank" rel="noopener">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
          <span class="text"><span class="main-t">ナゴヤドーム前店</span><span class="sub-t">イオンモールナゴヤドーム前</span></span>
