<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Instagram | NAG STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #faf8f5;
    color: #424242;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  .top-line { height: 3px; background: #c9a96e; }
  .wrap {
    max-width: 390px;
    min-height: 100vh;
    min-height: 100svh;
    margin: 0 auto;
    padding: 48px 24px 40px;
    display: flex;
    flex-direction: column;
  }
  header { text-align: center; margin: 40px 0 48px; }
  .eyebrow {
    font-size: 28px;
    letter-spacing: 0.3em;
    font-weight: 300;
    color: #c9a96e;
    margin-bottom: 14px;
    margin-right: -0.3em; /* letter-spacing分の中心ズレを補正 */
  }
  h1 { font-size: 18px; font-weight: 400; letter-spacing: 0.08em; }
  main { flex: 1; display: flex; flex-direction: column; gap: 16px; }
  .btn {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 20px 24px;
    background: #ffffff;
    border: 1px solid #e8e0d5;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    color: #424242;
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:active { transform: scale(0.98); box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
  .icon { flex-shrink: 0; width: 28px; height: 28px; color: #424242; }
  .text { flex: 1; min-width: 0; }
  .en { display: block; font-size: 15px; font-weight: 500; letter-spacing: 0.12em; }
  .ja { display: block; font-size: 11px; font-weight: 300; letter-spacing: 0.1em; margin-top: 4px; color: #6d6d6d; }
  .arrow { flex-shrink: 0; font-size: 24px; line-height: 1; font-weight: 300; color: #c9a96e; }
  footer {
    border-top: 1px solid #e8e0d5;
    padding-top: 24px;
    margin-top: 48px;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: #9e9e9e;
  }
</style>
</head>
<body>
<div class="top-line"></div>
<div class="wrap">
  <header>
    <p class="eyebrow">INSTAGRAM</p>
    <h1>アカウントを選択してください</h1>
  </header>

  <main>
    <a class="btn" href="https://www.instagram.com/hotyoga_nag_yogastudio/" target="_blank" rel="noopener">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2.75" y="2.75" width="18.5" height="18.5" rx="5.5"/>
        <circle cx="12" cy="12" r="4.25"/>
        <circle cx="17.6" cy="6.4" r="1.05" fill="currentColor" stroke="none"/>
      </svg>
      <span class="text">
        <span class="en">NAG YOGA STUDIO</span>
        <span class="ja">ナグ ヨガ スタジオ</span>
      </span>
      <span class="arrow" aria-hidden="true">›</span>
    </a>

    <a class="btn" href="https://www.instagram.com/pilates_nag_studio/" target="_blank" rel="noopener">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2.75" y="2.75" width="18.5" height="18.5" rx="5.5"/>
        <circle cx="12" cy="12" r="4.25"/>
        <circle cx="17.6" cy="6.4" r="1.05" fill="currentColor" stroke="none"/>
      </svg>
      <span class="text">
        <span class="en">PILATES NAG STUDIO</span>
        <span class="ja">ピラティス ナグ スタジオ</span>
      </span>
      <span class="arrow" aria-hidden="true">›</span>
    </a>
  </main>

  <footer>© NAG STUDIO</footer>
</div>
</body>
</html>
